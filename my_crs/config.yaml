# Qwen server
qwen:
  server_url: "http://localhost:11434/api/chat"
  model: "qwen3:8b"
  timeout: 120
  max_retries: 3
  think: false
  temperature: 0
  stream: false
  intent_timeout: 1200

# Pipeline settings
pipeline:
  top_k_candidates: 50
  max_fused_candidates: 15
  kbrd_top_preserved: 30
  weak_seed_threshold: 4
  genre_boost_factor: 15
  max_history_turns: 5
  serialisation_format: 1
  # Explicit feature flags for retrieval fusion
  use_seed_fusion: true
  use_qwen_seed_fallback: true
  use_qwen_candidate_fusion: true

# Entity extraction settings
extraction:
  resolver_version: "v3"
  use_legacy_non_movie_entities: true
  use_aux_dbpedia_uri_matching: true
  use_aux_genre_mapping: true
  use_aux_person_matching: false
  seed_selection: "all"
  fuzzy_cutoff_entity: 0.92
  fuzzy_cutoff_title: 0.85
  person_match_threshold: 85
  spacy_model: "en_core_web_sm"
  n_qwen_fusion_titles: 3

# TMDB API settings
tmdb:
  timeout: 2

# Evaluation settings
evaluation:
  k_values: [1, 10, 50]

# MLflow settings
mlflow:
  experiment_name: "crs-thesis"

# Web app settings
webapp:
  host: "0.0.0.0"
  port: 5000
  debug: false
